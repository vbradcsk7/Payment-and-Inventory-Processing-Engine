server:
  port: 8080

spring:
  application:
    name: payment-inventory-engine

  datasource:
    url: jdbc:h2:mem:payment_engine_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

# Custom Engine Configuration
payment:
  webhook:
    secret: ${WEBHOOK_SECRET:whsec_test_secret_key_123456789}
  orders:
    expiration-minutes: 15
    expiration-cron: 0 * * * * *

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ilich.paymentengine: INFO
