server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: payment-inventory-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_engine_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Custom Engine Configuration
payment:
  webhook:
    secret: ${WEBHOOK_SECRET:whsec_test_secret_key_123456789}
  orders:
    expiration-minutes: ${ORDER_EXPIRATION_MINUTES:15}
    expiration-cron: ${ORDER_EXPIRATION_CRON:0 * * * * *} # Runs every minute

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ilich.paymentengine: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: WARN
